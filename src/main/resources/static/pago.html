<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castillo · Detalle del pago</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="barra"></header>

  <main class="contenido contenido-medio">
    <p><a href="/panel.html" id="volver">← Volver a Pagos del mes</a></p>

    <div id="no-existe" class="vacio" hidden>
      Pago no encontrado. <a href="/panel.html">Volver a Pagos del mes</a>
    </div>

    <section id="contenido" hidden>
      <div class="encabezado-pagina">
        <h1 id="concepto"></h1>
        <span id="estado"></span>
      </div>
      <div id="aviso" class="aviso" hidden></div>

      <!-- HU-10 criterios 2 y 3: el pago en espera se distingue y muestra la nota del gerente -->
      <div id="caja-espera" class="caja-espera" hidden>
        <strong>El gerente puso este pago en espera</strong>
        <p id="nota-espera" class="nota-espera"></p>
        <small id="espera-info" class="nota"></small>
      </div>
      <p id="liberado-info" class="nota" hidden></p>

      <div class="acciones-pago">
        <!-- Asistente: subir comprobante (HU-07); bloqueado mientras esté en espera -->
        <div class="solo-asistente accion-con-ayuda">
          <button type="button" class="boton boton-primario" id="subir">Subir comprobante</button>
          <small id="subir-bloqueado" class="ayuda-bloqueo" hidden>El gerente puso este pago en espera</small>
        </div>
        <!-- Gerente: su única acción (HU-01 criterio 3) -->
        <div class="solo-gerente">
          <button type="button" class="boton boton-espera" id="poner-espera" hidden>Poner en espera</button>
          <button type="button" class="boton boton-primario" id="liberar" hidden>Liberar pago</button>
        </div>
      </div>

      <form id="form-espera" class="formulario solo-gerente form-espera" hidden novalidate>
        <label for="nota">Nota para el asistente</label>
        <textarea id="nota" rows="3" maxlength="200" placeholder="Ejemplo: Espera hasta que confirme el monto con el proveedor"></textarea>
        <small class="ayuda"><span id="contador-nota">0</span>/200</small>
        <small class="error-campo" id="error-nota" hidden></small>
        <div class="acciones">
          <button type="submit" class="boton boton-espera" id="confirmar-espera">Confirmar</button>
          <button type="button" class="boton boton-secundario" id="cancelar-espera">Cancelar</button>
        </div>
      </form>

      <dl class="datos">
        <div><dt>Monto</dt><dd id="monto"></dd></div>
        <div><dt>Vencimiento</dt><dd id="vencimiento"></dd></div>
        <div><dt>Categoría</dt><dd id="categoria"></dd></div>
        <div><dt>Registrado por</dt><dd id="registrado-por"></dd></div>
        <div><dt>Registrado el</dt><dd id="registrado-en"></dd></div>
        <div id="caja-observacion" hidden><dt>Observación</dt><dd id="observacion"></dd></div>
      </dl>

      <section class="datos-pago">
        <div class="encabezado-pagina">
          <h2>Datos de pago</h2>
          <button type="button" class="boton boton-primario" id="copiar">Copiar datos de pago</button>
        </div>
        <dl class="datos">
          <div><dt>Beneficiario</dt><dd><a id="beneficiario" href="#"></a></dd></div>
          <div><dt id="etiqueta-documento">Documento</dt><dd id="documento"></dd></div>
          <div><dt>Banco</dt><dd id="banco"></dd></div>
          <div><dt>Cuenta o CCI</dt><dd id="cuenta"></dd></div>
        </dl>
      </section>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pago.js"></script>
</body>
</html>
