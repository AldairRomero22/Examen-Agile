<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castillo · Panel</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="barra"></header>

  <main class="contenido">
    <section class="encabezado-editorial" id="encabezado-mes">
      <div>
        <span class="etiqueta-seccion"><span class="cuadro">C</span> Castillo · Control de pagos</span>
        <h1 id="titulo-lista">Cada pago, bajo control</h1>
        <p id="subtitulo-lista">Resumen de todos los pagos y alertas de vencimiento. Elige un mes para ver solo ese.</p>
      </div>
      <div class="acciones-cabecera">
        <label class="selector-mes" id="caja-mes">Mes
          <select id="mes" aria-label="Elegir mes"><option value="">Todos los meses</option></select>
        </label>
        <a href="/obligacion-nueva.html" class="boton boton-primario solo-asistente" id="nueva-obligacion">+ Nueva obligación</a>
      </div>
    </section>

    <div class="motivo-almena" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b></div>

    <div id="aviso" class="aviso" hidden></div>

    <!-- HU-04: total del mes y resumen por estado -->
    <section class="bloque-resumen" id="bloque-resumen">
      <div id="total"></div>
      <div class="resumen" id="resumen"></div>
    </section>

    <!-- HU-05: alertas de pago (de cualquier mes) -->
    <section class="alertas" id="alertas" aria-live="polite">
      <div class="alertas-cabecera">
        <div class="alertas-titulo">
          <span class="punto-alerta"></span>
          <h2>Requieren tu atención inmediata</h2>
          <span class="contador-alertas" id="contador-alertas" hidden></span>
        </div>
        <a href="/pagos.html?urgentes=1" id="ver-todos" hidden>Ver todos</a>
      </div>
      <p class="alertas-resumen" id="alertas-resumen"></p>
      <ul class="alertas-lista" id="alertas-lista"></ul>
    </section>

    <p class="ir-a-pagos"><a href="/pagos.html" id="ir-pagos">Ver la lista de pagos →</a></p>
  </main>

  <script src="/js/vendor/gsap.min.js"></script>
  <script src="/js/vendor/ScrollTrigger.min.js"></script>
  <script src="/js/vendor/lenis.min.js"></script>
  <script src="/js/animaciones.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
