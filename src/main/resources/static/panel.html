<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castillo · Panel</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="barra"></header>

  <main class="contenido">
    <div id="aviso" class="aviso" hidden></div>

    <!-- HU-05: alertas de pago (de cualquier mes) -->
    <section class="alertas" id="alertas" aria-live="polite">
      <div class="alertas-cabecera">
        <h2>Alertas de pago</h2>
        <a href="/panel.html?urgentes=1" id="ver-todos" hidden>Ver todos</a>
      </div>
      <p class="alertas-resumen" id="alertas-resumen"></p>
      <ul class="alertas-lista" id="alertas-lista"></ul>
    </section>

    <!-- HU-04: resumen del mes -->
    <div class="encabezado-pagina" id="encabezado-mes">
      <h1 id="titulo-lista">Pagos del mes</h1>
      <label class="selector-mes" id="caja-mes">Mes
        <input type="month" id="mes">
      </label>
      <a href="/panel.html" id="volver-mes" hidden>← Volver a Pagos del mes</a>
    </div>

    <section class="resumen" id="resumen"></section>

    <!-- HU-04 criterio 4: filtros combinables -->
    <div class="filtros" id="filtros">
      <div class="chips" id="chips-estado" role="group" aria-label="Filtrar por estado"></div>
      <select id="filtro-categoria" aria-label="Filtrar por categoría">
        <option value="">Todas las categorías</option>
      </select>
    </div>

    <div id="vacio" class="vacio" hidden>Aún no hay pagos registrados este mes</div>
    <div class="tabla-envoltorio" id="envoltorio" hidden>
      <table class="tabla">
        <thead>
          <tr>
            <th>Concepto</th><th>Categoría</th><th>Beneficiario</th>
            <th>Vence</th><th class="num">Monto</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
