<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castillo · Panel</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="barra"></header>

  <main class="contenido">
    <div class="encabezado-pagina">
      <h1>Pagos del mes</h1>
      <label class="selector-mes">Mes
        <input type="month" id="mes">
      </label>
    </div>

    <div id="aviso" class="aviso" hidden></div>
    <p class="nota">Lista provisional. El resumen con totales, filtros y alertas llega con las HU-04 y HU-05.</p>

    <div id="vacio" class="vacio" hidden>Aún no hay pagos registrados este mes</div>
    <div class="tabla-envoltorio" id="envoltorio" hidden>
      <table class="tabla">
        <thead>
          <tr>
            <th>Concepto</th><th>Categoría</th><th>Beneficiario</th>
            <th>Vence</th><th class="num">Monto</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/panel.js"></script>
</body>
</html>
