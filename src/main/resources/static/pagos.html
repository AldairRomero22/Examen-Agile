<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castillo · Pagos</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="barra"></header>

  <main class="contenido">
    <section class="encabezado-editorial" id="encabezado-mes">
      <div>
        <span class="etiqueta-seccion"><span class="cuadro">C</span> Castillo · Pagos</span>
        <h1 id="titulo-lista">Pagos</h1>
        <p id="subtitulo-lista">Todos los pagos, de todos los meses: busca, filtra y abre el detalle de cada uno.</p>
      </div>
      <div class="acciones-cabecera">
        <div class="selector-mes" id="caja-mes">
          <span id="etq-mes">Mes</span>
          <div class="calendario-mes">
            <input type="hidden" id="mes" value="">
            <button type="button" class="campo-mes" id="mes-boton" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="etq-mes mes-texto">
              <span id="mes-texto">Todos los meses</span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
            </button>
            <div class="panel-mes" id="mes-panel" role="dialog" aria-label="Elegir mes" hidden></div>
          </div>
          <button type="button" class="boton boton-secundario" id="todos-meses" hidden>Ver todos los meses</button>
        </div>
        <a href="/obligacion-nueva.html" class="boton boton-primario solo-asistente" id="nueva-obligacion">+ Nueva obligación</a>
        <a href="/pagos.html" id="volver-mes" class="boton boton-secundario" hidden>← Volver a todos los pagos</a>
      </div>
    </section>

    <div class="motivo-almena" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b></b></div>

    <div id="aviso" class="aviso" hidden></div>

    <!-- HU-04: lista del mes con filtros combinables -->
    <section class="lista-tarjeta">
      <div class="lista-cabecera">
        <h2 id="titulo-tabla">Todos los pagos</h2>
        <span class="lista-contador" id="contador-lista"></span>
      </div>
      <div class="filtros" id="filtros">
        <div class="chips" id="chips-estado" role="group" aria-label="Filtrar por estado"></div>
        <div class="filtros-campos">
          <input type="search" id="buscar" class="buscador" placeholder="Buscar concepto, a quién se paga o RUC" aria-label="Buscar por concepto o a quién se paga" autocomplete="off">
          <select id="filtro-categoria" aria-label="Filtrar por categoría">
            <option value="">Todas las categorías</option>
          </select>
        </div>
      </div>

      <div id="cargando" class="cargando" role="status"><span class="girando" aria-hidden="true"></span>Cargando pagos…</div>
      <div id="vacio" class="vacio" hidden>Aún no hay pagos registrados</div>
      <div class="tabla-envoltorio" id="envoltorio" hidden>
        <table class="tabla tabla-movil">
          <thead>
            <tr>
              <th>Concepto</th><th>Categoría</th><th>A quién se paga</th>
              <th>Vence</th><th class="num">Monto</th><th>Estado</th>
            </tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/vendor/gsap.min.js"></script>
  <script src="/js/vendor/ScrollTrigger.min.js"></script>
  <script src="/js/vendor/lenis.min.js"></script>
  <script src="/js/animaciones.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pagos.js"></script>
</body>
</html>
