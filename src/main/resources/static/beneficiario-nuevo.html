<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castillo · Nuevo beneficiario</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="barra"></header>

  <main class="contenido contenido-estrecho">
    <p><a id="enlace-volver" href="/beneficiarios.html">← Volver a Beneficiarios</a></p>
    <h1>Nuevo beneficiario</h1>
    <p class="nota">Registra a quién se le paga una sola vez; luego lo eliges en cada obligación sin volver a escribir sus datos.</p>

    <div id="aviso" class="aviso" hidden></div>

    <form id="formulario" class="formulario" novalidate>
      <label for="nombre">Nombre o razón social</label>
      <input id="nombre" type="text" maxlength="150" autocomplete="off">
      <small class="error-campo" id="error-nombre" hidden></small>

      <label for="documento">RUC (11 dígitos) o DNI (8 dígitos)</label>
      <input id="documento" type="text" inputmode="numeric" maxlength="11" autocomplete="off">
      <small class="error-campo" id="error-documento" hidden></small>

      <label for="categoriaId">Categoría (rubro)</label>
      <select id="categoriaId"><option value="">Elige una categoría</option></select>
      <small class="error-campo" id="error-categoriaId" hidden></small>

      <label for="banco">Banco</label>
      <select id="banco">
        <option value="">Elige un banco</option>
        <option>BCP</option><option>BBVA</option><option>Interbank</option><option>Scotiabank</option>
        <option>Banco de la Nación</option><option>BanBif</option><option>Pichincha</option><option>Mibanco</option>
        <option>Banco GNB</option><option>Banco Falabella</option><option>Banco Ripley</option><option>Citibank</option>
        <option>Caja Trujillo</option><option>Caja Arequipa</option><option>Caja Piura</option>
        <option>Caja Huancayo</option><option>Caja Cusco</option><option>Caja Sullana</option>
        <option value="__otro">Otro…</option>
      </select>
      <input id="banco-otro" type="text" maxlength="60" placeholder="Escribe el nombre del banco" autocomplete="off" hidden>
      <small class="error-campo" id="error-banco" hidden></small>

      <label for="cuenta">Cuenta o CCI (solo números, de 10 a 20 dígitos)</label>
      <input id="cuenta" type="text" inputmode="numeric" maxlength="20" autocomplete="off">
      <small class="error-campo" id="error-cuenta" hidden></small>

      <div class="acciones">
        <button type="submit" class="boton boton-primario" id="guardar">Guardar</button>
        <a href="/beneficiarios.html" class="boton boton-secundario" id="cancelar">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/reglas.js"></script>
  <script src="/js/beneficiario-nuevo.js"></script>
</body>
</html>
