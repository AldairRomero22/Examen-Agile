<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castillo · Beneficiarios</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <header id="barra"></header>

  <main class="contenido">
    <div class="encabezado-pagina">
      <h1>Beneficiarios</h1>
      <a href="/beneficiario-nuevo.html" class="boton boton-primario solo-asistente">Nuevo beneficiario</a>
    </div>

    <div id="aviso" class="aviso" hidden></div>
    <div id="cargando" class="cargando" role="status"><span class="girando" aria-hidden="true"></span>Cargando beneficiarios…</div>
    <div id="vacio" class="vacio" hidden>Aún no hay beneficiarios registrados</div>
    <div class="tabla-envoltorio" id="envoltorio" hidden>
      <table class="tabla tabla-movil">
        <thead>
          <tr><th>Nombre o razón social</th><th>Documento</th><th>Categoría</th><th>Banco</th><th>Estado</th></tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/vendor/gsap.min.js"></script>
  <script src="/js/vendor/ScrollTrigger.min.js"></script>
  <script src="/js/vendor/lenis.min.js"></script>
  <script src="/js/animaciones.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/beneficiarios.js"></script>
</body>
