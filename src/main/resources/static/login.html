<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Castillo · Iniciar sesión</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <h1 class="marca">Castillo</h1>
    <p class="subtitulo">Control de pagos</p>

    <div id="aviso" class="aviso" hidden></div>

    <form id="form-login" method="post" action="/login" novalidate>
      <input type="hidden" name="_csrf" id="csrf">

      <label for="correo">Correo</label>
      <input id="correo" name="correo" type="email" autocomplete="username">
      <small class="error-campo" id="error-correo" hidden>Ingresa tu correo</small>

      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password">
      <small class="error-campo" id="error-clave" hidden>Ingresa tu contraseña</small>

      <button type="submit" class="boton boton-primario">Ingresar</button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
