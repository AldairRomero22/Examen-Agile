spring.application.name=castillo

# Render define PORT; en tu PC se usa 8080
server.port=${PORT:8080}
# Render pone HTTPS delante: así las redirecciones usan https
server.forward-headers-strategy=framework
server.servlet.session.timeout=8h

# La conexión a Neon llega por variables de entorno:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.hikari.maximum-pool-size=5

# Las tablas las crea Flyway (src/main/resources/db/migration), no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# HU-07: vouchers JPG, PNG o PDF de hasta 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# HU-07: lector del voucher, intercambiable por configuración (variable LECTOR_VOUCHER).
#   tesseract = OCR local (por ahora el único)   ·   ia = visión por IA (se agrega después)
castillo.lector=${LECTOR_VOUCHER:tesseract}
# Tesseract: en Windows, si no está en el PATH, TESSERACT_CMD=C:\Program Files\Tesseract-OCR\tesseract.exe
castillo.tesseract.comando=${TESSERACT_CMD:tesseract}
castillo.tesseract.idiomas=${TESSERACT_IDIOMAS:spa+eng}
castillo.tesseract.limite-segundos=${TESSERACT_LIMITE_SEGUNDOS:90}

# Cuentas iniciales (HU-01). Las claves llegan por variables de entorno:
# CASTILLO_ASISTENTE_CLAVE y CASTILLO_GERENTE_CLAVE
castillo.asistente.correo=asistente@castillo.pe
castillo.gerente.correo=gerente@castillo.pe
